name: git-ops
version: 0.8.1
description: "Deterministic git tools: discover every repo under a root (submodules included) with a one-call state probe, read status/diff/log, generate a Conventional Commits message from the diff, commit explicit paths, push with proof, fast-forward pull with submodule sync (a submodule on a branch keeps it), and discard tracked work-tree changes. Commit/push/pull/discard push a plugin.git-ops.<kind> event to the running session so the desktop pane refreshes at once, and poke the composer's coding status bar (branch/ahead-behind/±) so it re-probes immediately — REST mutations emit no tool event, so core would otherwise leave the bar stale until the next turn settles. A row click opens TortoiseGit's diff window, degrades to the file in VS Code when TortoiseGit refuses the path (untracked, binary) and to an in-pane diff dialog when neither has anything to show. A file-tree row in the search panel opens the file in VS Code on click and reveals a copy button on hover that puts its repo-relative path on the clipboard. The desktop pane keeps its timers ctx-scoped (no poller survives a reload), ships zh/en bundles, and exposes a Settings ▸ Plugins page for ignored file suffixes, poll cadence and scan depth."
author: as850
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - git_repos
  - git_status
  - git_diff
  - git_log
  - git_commit_info
  - git_commit
  - git_push
  - git_pull
  - git_discard
